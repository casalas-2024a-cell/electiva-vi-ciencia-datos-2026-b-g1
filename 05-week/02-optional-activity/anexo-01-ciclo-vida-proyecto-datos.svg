<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Ciclo de vida del proyecto de datos aplicado al caso de logística
  </text>
  <text x="600" y="56" text-anchor="middle" font-size="13.5" fill="#475569">
    Retrasos en entregas de última milla · dataset Delivery Logistics (India)
  </text>

  <rect x="40" y="76" width="1120" height="6" rx="3" fill="url(#bar)"/>

  <!-- 7 stage boxes -->
  <!-- box width 150, gap, 7 boxes across 1120 width starting x=40 -->
  <g font-size="13" fill="#0f172a">

    <!-- Stage 1 -->
    <rect x="30" y="120" width="150" height="150" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="105" y="145" text-anchor="middle" font-weight="700" fill="#0e7490">1. Pregunta</text>
    <text x="105" y="168" text-anchor="middle" font-size="11.5" fill="#155e63">¿Qué combinación</text>
    <text x="105" y="184" text-anchor="middle" font-size="11.5" fill="#155e63">de transportista,</text>
    <text x="105" y="200" text-anchor="middle" font-size="11.5" fill="#155e63">clima y vehículo</text>
    <text x="105" y="216" text-anchor="middle" font-size="11.5" fill="#155e63">genera más</text>
    <text x="105" y="232" text-anchor="middle" font-size="11.5" fill="#155e63">retrasos?</text>

    <!-- Stage 2 -->
    <rect x="195" y="120" width="150" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="270" y="145" text-anchor="middle" font-weight="700" fill="#1d4ed8">2. Obtención</text>
    <text x="270" y="168" text-anchor="middle" font-size="11.5" fill="#1e40af">Kaggle: 25 000</text>
    <text x="270" y="184" text-anchor="middle" font-size="11.5" fill="#1e40af">entregas</text>
    <text x="270" y="200" text-anchor="middle" font-size="11.5" fill="#1e40af">(estructurado)</text>
    <text x="270" y="216" text-anchor="middle" font-size="11.5" fill="#1e40af">+ clima en</text>
    <text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#1e40af">tiempo real (API)</text>

    <!-- Stage 3 -->
    <rect x="360" y="120" width="150" height="150" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="435" y="145" text-anchor="middle" font-weight="700" fill="#854d0e">3. Limpieza</text>
    <text x="435" y="168" text-anchor="middle" font-size="11.5" fill="#713f12">Nulos, duplicados,</text>
    <text x="435" y="184" text-anchor="middle" font-size="11.5" fill="#713f12">unidades de</text>
    <text x="435" y="200" text-anchor="middle" font-size="11.5" fill="#713f12">distancia/tiempo,</text>
    <text x="435" y="216" text-anchor="middle" font-size="11.5" fill="#713f12">cruce con datos</text>
    <text x="435" y="232" text-anchor="middle" font-size="11.5" fill="#713f12">de clima</text>

    <!-- Stage 4 -->
    <rect x="525" y="120" width="150" height="150" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="600" y="145" text-anchor="middle" font-weight="700" fill="#7e22ce">4. Análisis</text>
    <text x="600" y="168" text-anchor="middle" font-size="11.5" fill="#6b21a8">Descriptivo:</text>
    <text x="600" y="184" text-anchor="middle" font-size="11.5" fill="#6b21a8">tasa de retraso</text>
    <text x="600" y="200" text-anchor="middle" font-size="11.5" fill="#6b21a8">por transportista,</text>
    <text x="600" y="216" text-anchor="middle" font-size="11.5" fill="#6b21a8">clima y tipo de</text>
    <text x="600" y="232" text-anchor="middle" font-size="11.5" fill="#6b21a8">vehículo</text>

    <!-- Stage 5 -->
    <rect x="690" y="120" width="150" height="150" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
    <text x="765" y="145" text-anchor="middle" font-weight="700" fill="#be123c">5. Modelado</text>
    <text x="765" y="168" text-anchor="middle" font-size="11.5" fill="#9f1239">Predictivo:</text>
    <text x="765" y="184" text-anchor="middle" font-size="11.5" fill="#9f1239">probabilidad de</text>
    <text x="765" y="200" text-anchor="middle" font-size="11.5" fill="#9f1239">retraso por</text>
    <text x="765" y="216" text-anchor="middle" font-size="11.5" fill="#9f1239">combinación de</text>
    <text x="765" y="232" text-anchor="middle" font-size="11.5" fill="#9f1239">factores</text>

    <!-- Stage 6 -->
    <rect x="855" y="120" width="150" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="930" y="145" text-anchor="middle" font-weight="700" fill="#15803d">6. Comunicación</text>
    <text x="930" y="168" text-anchor="middle" font-size="11.5" fill="#166534">Mapa de riesgo</text>
    <text x="930" y="184" text-anchor="middle" font-size="11.5" fill="#166534">de retraso por</text>
    <text x="930" y="200" text-anchor="middle" font-size="11.5" fill="#166534">ruta/transportista</text>
    <text x="930" y="216" text-anchor="middle" font-size="11.5" fill="#166534">para logística</text>
    <text x="930" y="232" text-anchor="middle" font-size="11.5" fill="#166534">y clientes</text>

    <!-- Stage 7 -->
    <rect x="1020" y="120" width="150" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1095" y="145" text-anchor="middle" font-weight="700" fill="#c2410c">7. Acción</text>
    <text x="1095" y="168" text-anchor="middle" font-size="11.5" fill="#9a3412">Reasignar rutas/</text>
    <text x="1095" y="184" text-anchor="middle" font-size="11.5" fill="#9a3412">transportistas o</text>
    <text x="1095" y="200" text-anchor="middle" font-size="11.5" fill="#9a3412">ajustar el tiempo</text>
    <text x="1095" y="216" text-anchor="middle" font-size="11.5" fill="#9a3412">prometido en</text>
    <text x="1095" y="232" text-anchor="middle" font-size="11.5" fill="#9a3412">condiciones de riesgo</text>

  </g>

  <!-- arrows between boxes -->
  <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <line x1="182" y1="195" x2="193" y2="195"/>
    <line x1="347" y1="195" x2="358" y2="195"/>
    <line x1="512" y1="195" x2="523" y2="195"/>
    <line x1="677" y1="195" x2="688" y2="195"/>
    <line x1="842" y1="195" x2="853" y2="195"/>
    <line x1="1007" y1="195" x2="1018" y2="195"/>
  </g>

  <!-- Legend: analytics type -->
  <g>
    <rect x="30" y="300" width="1140" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="50" y="326" font-size="14" font-weight="700" fill="#0f172a">Tipo de analítica en este proyecto</text>

    <rect x="50" y="345" width="18" height="18" rx="4" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="76" y="359" font-size="12.5" fill="#1e293b">Descriptiva — "¿qué está pasando?": tasas de retraso por transportista, clima y vehículo (etapa 4).</text>

    <rect x="50" y="372" width="18" height="18" rx="4" fill="#ffe4e6" stroke="#e11d48"/>
    <text x="76" y="386" font-size="12.5" fill="#1e293b">Predictiva — "¿qué es probable que pase?": modelo de probabilidad de retraso por combinación de factores (etapa 5).</text>

    <text x="50" y="410" font-size="12" fill="#475569">Fuentes: estructuradas (Kaggle) combinadas con datos climáticos en tiempo real (semi-estructuradas, vía API).</text>
  </g>

  <text x="600" y="450" text-anchor="middle" font-size="11" fill="#94a3b8">
    Elaboración propia — adaptado del ciclo de vida de un proyecto de ciencia de datos (Provost &amp; Fawcett, 2013; Cao, 2017)
  </text>
</svg>
