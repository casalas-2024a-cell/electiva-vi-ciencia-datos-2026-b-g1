<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#ffffff"/>

  <text x="620" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Arquitectura de datos — Retrasos en última milla
  </text>
  <text x="620" y="53" text-anchor="middle" font-size="13.5" fill="#475569">
    Fuentes → Ingesta → Almacenamiento → Procesamiento → Análisis / BI
  </text>

  <!-- 5 stage columns -->
  <!-- x: 20,260,500,740,980 width 220 -->
  <g font-size="12">

    <!-- FUENTES -->
    <rect x="20" y="90" width="220" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="130" y="116" text-anchor="middle" font-weight="700" font-size="14" fill="#1d4ed8">1. Fuentes</text>
    <rect x="34" y="130" width="192" height="42" rx="6" fill="#dbeafe"/>
    <text x="130" y="147" text-anchor="middle" fill="#1e3a8a" font-size="11">Histórico Kaggle</text>
    <text x="130" y="162" text-anchor="middle" fill="#1e3a8a" font-size="11">(25 000 entregas)</text>
    <rect x="34" y="178" width="192" height="42" rx="6" fill="#dbeafe"/>
    <text x="130" y="195" text-anchor="middle" fill="#1e3a8a" font-size="11">API de clima</text>
    <text x="130" y="210" text-anchor="middle" fill="#1e3a8a" font-size="11">en tiempo real</text>
    <rect x="34" y="226" width="192" height="42" rx="6" fill="#dbeafe"/>
    <text x="130" y="243" text-anchor="middle" fill="#1e3a8a" font-size="11">GPS / telemetría</text>
    <text x="130" y="258" text-anchor="middle" fill="#1e3a8a" font-size="11">del vehículo</text>
    <rect x="34" y="274" width="192" height="42" rx="6" fill="#dbeafe"/>
    <text x="130" y="291" text-anchor="middle" fill="#1e3a8a" font-size="11">ERP / facturación</text>
    <text x="130" y="306" text-anchor="middle" fill="#1e3a8a" font-size="11">del operador</text>
    <rect x="34" y="322" width="192" height="42" rx="6" fill="#dbeafe"/>
    <text x="130" y="339" text-anchor="middle" fill="#1e3a8a" font-size="11">Encuestas / fotos</text>
    <text x="130" y="354" text-anchor="middle" fill="#1e3a8a" font-size="11">de entrega (POD)</text>

    <!-- INGESTA -->
    <rect x="260" y="90" width="220" height="330" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
    <text x="370" y="116" text-anchor="middle" font-weight="700" font-size="14" fill="#be185d">2. Ingesta</text>
    <rect x="274" y="140" width="192" height="60" rx="6" fill="#fce7f3"/>
    <text x="370" y="160" text-anchor="middle" fill="#831843" font-size="11" font-weight="700">Batch (carga diaria)</text>
    <text x="370" y="177" text-anchor="middle" fill="#831843" font-size="10.5">histórico Kaggle,</text>
    <text x="370" y="191" text-anchor="middle" fill="#831843" font-size="10.5">ERP, encuestas</text>
    <rect x="274" y="210" width="192" height="60" rx="6" fill="#fce7f3"/>
    <text x="370" y="230" text-anchor="middle" fill="#831843" font-size="11" font-weight="700">Streaming (eventos)</text>
    <text x="370" y="247" text-anchor="middle" fill="#831843" font-size="10.5">clima y GPS vía</text>
    <text x="370" y="261" text-anchor="middle" fill="#831843" font-size="10.5">cola de eventos</text>
    <rect x="274" y="284" width="192" height="60" rx="6" fill="#fbcfe8"/>
    <text x="370" y="308" text-anchor="middle" fill="#9d174d" font-size="12" font-weight="700">Herramienta:</text>
    <text x="370" y="326" text-anchor="middle" fill="#9d174d" font-size="11">Apache Kafka</text>
    <text x="370" y="340" text-anchor="middle" fill="#9d174d" font-size="10">(Kreps et al., 2011)</text>

    <!-- ALMACENAMIENTO -->
    <rect x="500" y="90" width="220" height="330" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
    <text x="610" y="116" text-anchor="middle" font-weight="700" font-size="14" fill="#15803d">3. Almacenamiento</text>
    <rect x="514" y="140" width="192" height="70" rx="6" fill="#dcfce7"/>
    <text x="610" y="160" text-anchor="middle" fill="#14532d" font-size="11" font-weight="700">Data Lake</text>
    <text x="610" y="177" text-anchor="middle" fill="#14532d" font-size="10.5">datos crudos: JSON</text>
    <text x="610" y="191" text-anchor="middle" fill="#14532d" font-size="10.5">clima, GPS, fotos,</text>
    <text x="610" y="204" text-anchor="middle" fill="#14532d" font-size="10.5">texto de encuestas</text>
    <rect x="514" y="220" width="192" height="70" rx="6" fill="#dcfce7"/>
    <text x="610" y="240" text-anchor="middle" fill="#14532d" font-size="11" font-weight="700">Data Warehouse</text>
    <text x="610" y="257" text-anchor="middle" fill="#14532d" font-size="10.5">tablas limpias:</text>
    <text x="610" y="271" text-anchor="middle" fill="#14532d" font-size="10.5">entregas + retraso</text>
    <text x="610" y="284" text-anchor="middle" fill="#14532d" font-size="10.5">listas para BI</text>
    <rect x="514" y="300" width="192" height="44" rx="6" fill="#bbf7d0"/>
    <text x="610" y="318" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">Enfoque: híbrido</text>
    <text x="610" y="334" text-anchor="middle" fill="#166534" font-size="10">lake (crudo) + warehouse (curado)</text>

    <!-- PROCESAMIENTO -->
    <rect x="740" y="90" width="220" height="330" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="850" y="116" text-anchor="middle" font-weight="700" font-size="14" fill="#b45309">4. Procesamiento</text>
    <rect x="754" y="140" width="192" height="60" rx="6" fill="#fef3c7"/>
    <text x="850" y="160" text-anchor="middle" fill="#78350f" font-size="11" font-weight="700">Batch (ETL nocturno)</text>
    <text x="850" y="177" text-anchor="middle" fill="#78350f" font-size="10.5">limpieza, cruce clima</text>
    <text x="850" y="191" text-anchor="middle" fill="#78350f" font-size="10.5">histórico, features</text>
    <rect x="754" y="210" width="192" height="60" rx="6" fill="#fef3c7"/>
    <text x="850" y="230" text-anchor="middle" fill="#78350f" font-size="11" font-weight="700">Streaming (alertas)</text>
    <text x="850" y="247" text-anchor="middle" fill="#78350f" font-size="10.5">score de riesgo casi</text>
    <text x="850" y="261" text-anchor="middle" fill="#78350f" font-size="10.5">en tiempo real</text>
    <rect x="754" y="284" width="192" height="60" rx="6" fill="#fde68a"/>
    <text x="850" y="304" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">Herramienta:</text>
    <text x="850" y="322" text-anchor="middle" fill="#92400e" font-size="11">Apache Spark</text>
    <text x="850" y="336" text-anchor="middle" fill="#92400e" font-size="10">(Zaharia et al., 2016)</text>

    <!-- ANALISIS/BI -->
    <rect x="980" y="90" width="220" height="330" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="1090" y="116" text-anchor="middle" font-weight="700" font-size="14" fill="#6d28d9">5. Análisis / BI</text>
    <rect x="994" y="140" width="192" height="70" rx="6" fill="#ede9fe"/>
    <text x="1090" y="160" text-anchor="middle" fill="#4c1d95" font-size="11" font-weight="700">Tablero descriptivo</text>
    <text x="1090" y="177" text-anchor="middle" fill="#4c1d95" font-size="10.5">tasa de retraso por</text>
    <text x="1090" y="191" text-anchor="middle" fill="#4c1d95" font-size="10.5">transportista/clima/</text>
    <text x="1090" y="204" text-anchor="middle" fill="#4c1d95" font-size="10.5">vehículo</text>
    <rect x="994" y="220" width="192" height="60" rx="6" fill="#ede9fe"/>
    <text x="1090" y="240" text-anchor="middle" fill="#4c1d95" font-size="11" font-weight="700">Alerta operativa</text>
    <text x="1090" y="257" text-anchor="middle" fill="#4c1d95" font-size="10.5">probabilidad de</text>
    <text x="1090" y="271" text-anchor="middle" fill="#4c1d95" font-size="10.5">retraso por envío</text>
    <rect x="994" y="290" width="192" height="54" rx="6" fill="#ddd6fe"/>
    <text x="1090" y="310" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="700">Herramienta:</text>
    <text x="1090" y="328" text-anchor="middle" fill="#5b21b6" font-size="11">Metabase / Power BI</text>

  </g>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="2.2" marker-end="url(#arrow2)">
    <line x1="242" y1="255" x2="258" y2="255"/>
    <line x1="482" y1="255" x2="498" y2="255"/>
    <line x1="722" y1="255" x2="738" y2="255"/>
    <line x1="962" y1="255" x2="978" y2="255"/>
  </g>

  <!-- footer note -->
  <rect x="20" y="440" width="1200" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="464" font-size="13" font-weight="700" fill="#0f172a">Decisiones de diseño</text>
  <text x="40" y="486" font-size="11.5" fill="#1e293b">• Lake + Warehouse (híbrido): el lake conserva clima/GPS/fotos en crudo para explorar y reentrenar modelos; el warehouse expone</text>
  <text x="40" y="502" font-size="11.5" fill="#1e293b">  tablas curadas (entrega, retraso, factores) para que BI consulte rápido, siguiendo la separación dato crudo/dato curado de Inmon (2005) y Sawadogo &amp; Darmont (2021).</text>
  <text x="40" y="522" font-size="11.5" fill="#1e293b">• Batch + Streaming (híbrido): batch para el grueso del histórico y reentrenamiento; streaming solo donde el clima/GPS exige alertar antes de que el vehículo salga.</text>

  <text x="620" y="555" text-anchor="middle" font-size="11" fill="#94a3b8">
    Elaboración propia — herramientas y patrón basados en Kreps et al. (2011), Zaharia et al. (2016), Inmon (2005) y Sawadogo &amp; Darmont (2021)
  </text>
</svg>
